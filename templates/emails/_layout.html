<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <style>
    body { margin: 0; padding: 0; background: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; }
    .header { padding: 24px; text-align: center; background: #ffffff; border-bottom: 1px solid #eaeaea; }
    .header img { max-height: 48px; max-width: 180px; width: auto; height: auto; }
    .content { padding: 32px 24px; color: #333333; line-height: 1.6; }
    .footer { padding: 24px; text-align: center; font-size: 13px; color: #999999; border-top: 1px solid #eaeaea; }
    .footer p { white-space: pre-line; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      {{if .LogoURL}}<img src="{{.LogoURL}}" alt="{{.StoreName}}" width="180" style="max-height:48px;height:auto;max-width:180px;">{{else}}{{if .StoreName}}<strong>{{.StoreName}}</strong>{{end}}{{end}}
    </div>
    <div class="content">
      {{.Body}}
    </div>
    <div class="footer">
      <p style="white-space:pre-line;margin:0;">{{if and .StoreName .StoreAddress}}{{.StoreName}} — {{.StoreAddress}}{{else if .StoreName}}{{.StoreName}}{{else}}{{.StoreAddress}}{{end}}</p>
    </div>
  </div>
</body>
</html>
