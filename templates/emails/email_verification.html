<!-- Subject: Verify your email address -->
<h1>Verify Your Email</h1>
{{if .Data.FirstName}}<p>Hi {{.Data.FirstName}},</p>{{end}}
<p>Confirm this email address for your account by clicking the button below:</p>

<p style="margin: 24px 0;">
  <a href="{{.Data.VerifyURL}}"
     style="display: inline-block; padding: 12px 24px; background: #333333; color: #ffffff; text-decoration: none; border-radius: 4px;">
    Verify your account email address
  </a>
</p>

<p>This link is time-limited.</p>

<p style="color: #999999; font-size: 13px; margin-top: 24px;">
  If you didn't create an account, you can safely ignore this email.
</p>
