# SAMPLE — copy to .github/workflows/release.yml only if you publish GHCR images.
# Set repository variable SHOPANDA_IMAGE_NAME to your product slug (never "shopanda").
# Pins and guards mirror Shopanda upstream release.yml (sha immutability, concurrency).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (do not push to GHCR)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image coordinates
        id: meta
        env:
          SHOPANDA_IMAGE_NAME: ${{ vars.SHOPANDA_IMAGE_NAME }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_name="${SHOPANDA_IMAGE_NAME:-}"
          if [[ -z "${image_name}" || "${image_name}" == "shopanda" ]]; then
            echo "ERROR: set repository variable SHOPANDA_IMAGE_NAME to your product slug." >&2
            echo "Refusing to publish as ghcr.io/${owner}/shopanda from a sample product workflow." >&2
            exit 1
          fi
          if [[ ! "${image_name}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "ERROR: SHOPANDA_IMAGE_NAME '${image_name}' is not a valid image repository name." >&2
            exit 1
          fi
          name="ghcr.io/${owner}/${image_name}"
          sha_tag="sha-${GITHUB_SHA}"
          tags="${name}:${sha_tag}"
          has_version=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF_NAME}"
            if [[ ! "${version_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "ERROR: git tag '${version_tag}' is not a valid Docker tag component." >&2
              exit 1
            fi
            tags="${tags},${name}:${version_tag}"
            has_version=true
            echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
          fi

          event="${{ github.event_name }}"
          dry_run="${{ inputs.dry_run }}"
          do_push=false
          do_load=false
          if [[ "${event}" == "push" ]]; then
            do_push=true
          elif [[ "${event}" == "workflow_dispatch" ]]; then
            if [[ "${dry_run}" == "false" ]]; then
              do_push=true
            else
              do_load=true
            fi
          fi

          {
            echo "name=${name}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${tags}"
            echo "has_version=${has_version}"
            echo "do_push=${do_push}"
            echo "do_load=${do_load}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - if: ${{ steps.meta.outputs.do_push == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — sha tag must stay immutable
        if: ${{ steps.meta.outputs.do_push == 'true' }}
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          sha_tag="${{ steps.meta.outputs.sha_tag }}"
          if docker buildx imagetools inspect "${name}:${sha_tag}" >/dev/null 2>&1; then
            echo "ERROR: ${name}:${sha_tag} already exists in GHCR." >&2
            echo "sha-<commit> tags are immutable deploy pins and must never be overwritten." >&2
            exit 1
          fi
          echo "OK: ${name}:${sha_tag} not yet published — proceeding."

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.do_push == 'true' }}
          load: ${{ steps.meta.outputs.do_load == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

      - name: Smoke — binary present
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          sha_tag="${{ steps.meta.outputs.sha_tag }}"
          digest="${{ steps.build.outputs.digest }}"
          if [[ "${{ steps.meta.outputs.do_push }}" == "true" && -n "${digest}" ]]; then
            img="${name}@${digest}"
            docker pull "${img}"
          else
            img="${name}:${sha_tag}"
          fi
          docker run --rm --entrypoint /bin/sh "${img}" -c 'test -x /usr/local/bin/shopanda'
          echo "Smoke OK for ${img}"
