# Release — build and push container image to GHCR on version tags.
#
# Immutable deploy pin: ghcr.io/<owner>/shopanda:sha-<full40gitsha> (or image digest).
# Version tag (e.g. v1.2.3) is a mutable convenience alias only — do not pin deploys to it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (do not push to GHCR)
        type: boolean
        default: true

concurrency:
  # Keyed on the commit, not the ref: two different tags (or a tag push and a
  # workflow_dispatch) pointing at the same commit must serialize, otherwise both
  # can pass the sha-tag "does it exist yet" guard before either has pushed.
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Pin to full SHA (tag v4.4.0) — mutable tags can be retargeted.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Image coordinates
        id: meta
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/shopanda"
          sha_tag="sha-${GITHUB_SHA}"
          tags="${name}:${sha_tag}"
          has_version=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF_NAME}"
            # Docker tag grammar: [A-Za-z0-9_][A-Za-z0-9._-]{0,127} — reject SemVer '+' etc. early.
            if [[ ! "${version_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "ERROR: git tag '${version_tag}' is not a valid Docker tag component." >&2
              echo "Use names matching [A-Za-z0-9_][A-Za-z0-9._-]{0,127} (e.g. v1.2.3). SemVer '+' metadata is not allowed." >&2
              exit 1
            fi
            tags="${tags},${name}:${version_tag}"
            has_version=true
            echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
          fi

          # workflow_dispatch boolean inputs compare as strings in expressions
          # (actions/runner#3571). Normalize once here; later steps use these outputs.
          event="${{ github.event_name }}"
          dry_run="${{ inputs.dry_run }}"
          do_push=false
          do_load=false
          if [[ "${event}" == "push" ]]; then
            do_push=true
          elif [[ "${event}" == "workflow_dispatch" ]]; then
            if [[ "${dry_run}" == "false" ]]; then
              do_push=true
            else
              do_load=true
            fi
          fi

          {
            echo "name=${name}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${tags}"
            echo "has_version=${has_version}"
            echo "do_push=${do_push}"
            echo "do_load=${do_load}"
          } >> "${GITHUB_OUTPUT}"

          echo "Immutable tag: ${name}:${sha_tag}"
          echo "do_push=${do_push} do_load=${do_load}"
          if [[ "${has_version}" == "true" ]]; then
            echo "Version alias (mutable): ${name}:${GITHUB_REF_NAME}"
          fi

      - name: Set up Docker Buildx
        # Pin to full SHA (tag v4.2.0).
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.do_push == 'true' }}
        # Pin to full SHA (tag v4.6.0).
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — sha tag must stay immutable
        if: ${{ steps.meta.outputs.do_push == 'true' }}
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          sha_tag="${{ steps.meta.outputs.sha_tag }}"
          # Alpine packages (ca-certificates, wget) are installed unpinned at build
          # time, so rebuilding the same commit is not guaranteed to reproduce the
          # same image content. Never overwrite an already-published sha-<sha> tag —
          # it is documented as an immutable deploy pin.
          if docker buildx imagetools inspect "${name}:${sha_tag}" >/dev/null 2>&1; then
            echo "ERROR: ${name}:${sha_tag} already exists in GHCR." >&2
            echo "sha-<commit> tags are immutable deploy pins and must never be overwritten." >&2
            echo "Re-releasing the same commit is not supported. Cut a new commit (and tag) instead." >&2
            exit 1
          fi
          echo "OK: ${name}:${sha_tag} not yet published — proceeding."

      - name: Build and push
        id: build
        # Pin to full SHA (tag v7.3.0).
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.do_push == 'true' }}
          load: ${{ steps.meta.outputs.do_load == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # SBOM/signing deferred (PR-1010 out of scope); avoid extra attestation perms.
          provenance: false
          sbom: false

      - name: Smoke — binary present
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          sha_tag="${{ steps.meta.outputs.sha_tag }}"
          digest="${{ steps.build.outputs.digest }}"
          if [[ "${{ steps.meta.outputs.do_push }}" == "true" && -n "${digest}" ]]; then
            img="${name}@${digest}"
            docker pull "${img}"
          else
            # Dry-run: load=true left this exact tag in the local daemon (not on GHCR).
            img="${name}:${sha_tag}"
          fi
          docker run --rm --entrypoint /bin/sh "${img}" -c 'test -x /usr/local/bin/shopanda'
          echo "Smoke OK for ${img}"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## GHCR image"
            echo ""
            echo "- **Immutable pin:** \`${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.sha_tag }}\`"
            if [[ -n "${{ steps.build.outputs.digest }}" ]]; then
              echo "- **Digest:** \`${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}\`"
            fi
            if [[ "${{ steps.meta.outputs.has_version }}" == "true" ]]; then
              echo "- **Version alias (do not pin deploys):** \`${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version_tag }}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
